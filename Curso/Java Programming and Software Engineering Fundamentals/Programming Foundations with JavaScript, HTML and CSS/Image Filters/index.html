<!DOCTYPE html>                                             <!-- Define que o documento segue o padrão HTML5.-->
<html lang="pt-BR">                                         <!-- Indica que o idioma principal da página é português do Brasil.-->          

<head>                                                      
  <meta charset="UTF-8">                                    <!-- Define a codificação de caracteres como UTF-8, permitindo acentos e caracteres especiais.-->
  <title>Image Filter</title>                               <!-- Título da aba do navegador.-->
  <link rel="stylesheet" href="style.css">                  <!-- Importa o arquivo CSS externo para estilizar a página.-->
  <script src="https://www.dukelearntoprogram.com/course1/common/js/image/SimpleImage.js"></script> <!--Biblioteca da Duke Umiversity-->
</head>

<body>
  <h2>Selecione uma imagem para exibir:</h2>                <!-- Cabeçalho com instrução para o usuário.-->

  <!-- Container principal -->
  <div class="container">

    <!-- Bloco 1 -->
    <div class="block">
      <h3>Image</h3>
      <canvas id="ImageCanvas" style="max-width:400px; border:2px solid #ccc; border-radius:8px;"></canvas>
      <input type="file" id="fileInput" accept="image/*" onchange = "loadImage()">
    </div>

    <!-- Bloco Resultado -->
    <div class="block">
      <h3>Composition</h3>
      <canvas id="FilterCanvas" style="max-width:400px; border:2px solid #ccc; border-radius:8px;"></canvas>
    </div>

  </div>

  <div style="flex-basis: 100%; text-align: center; margin-top: 20px;">
    <button type="button" id="clear" onclick="clearCanvas()">Limpa a composição</button>
    <button type="button" id="GrayFilter" onclick="doGray()">Aplica filtro petro e branco</button>
    <button type="button" id="RedFilter" onclick="doRed()">Aplica filtro vermelho</button>
    <button type="button" id="NegativeFilter" onclick="doNegative()">Aplica filtro negativo</button>
    <button type="button" id="RainbowFilter" onclick="doRainbow()">Aplica filtro arco-íris</button>
    <button type="button" id="BlurFilter" onclick="doBlur()">Aplica filtro de desfoque</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
